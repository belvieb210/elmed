<VirtualHost *:80>
    ServerName elmedical.duckdns.org
    ServerAlias www.elmedical.duckdns.org

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass /api/temps-reel http://127.0.0.1:4000/api/temps-reel flushpackets=on
    ProxyPassReverse /api/temps-reel http://127.0.0.1:4000/api/temps-reel
    ProxyPass /api http://127.0.0.1:4000/api
    ProxyPassReverse /api http://127.0.0.1:4000/api

    ProxyPass /socket.io/ http://127.0.0.1:4000/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:4000/socket.io/

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/elmedical-error.log
    CustomLog ${APACHE_LOG_DIR}/elmedical-access.log combined
</VirtualHost>
